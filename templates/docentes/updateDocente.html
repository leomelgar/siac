{% extends "layout.html" %} {% block body %}
<div class="text-center"><h3 class="text-white">Actualizar Datos del Docente</h3></div>
<div class="container py-5">
        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta Principal de Perfil -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body pt-5">
                        <!-- Foto de Perfil -->
                        <img src="https://github.com/mdo.png"
                             alt="Foto del Docente" 
                             class="rounded-circle img-thumbnail mb-3" 
                             style="width: 150px; height: 150px; object-fit: cover;">                        
                        <!-- Nombre y Cargo -->
                        <!-- <h4 class="card-title mb-1">{{docente.apellido}}, {{docente.nombre}}</h4>
                        <p class="text-muted mb-3">Profesor {{docente.cargo}} de Ingeniería de Software</p> -->
                        <!-- Estado -->
                    </div>
                    <!-- Redes Sociales / Enlaces -->
                    <div class="card-footer bg-transparent border-0 pb-4">
                        <div class="d-flex justify-content-center gap-2">
                            <a href="#" class="btn btn-sm btn-outline-primary rounded-circle"><i class="fab fa-linkedin-in"></i></a>
                            <a href="#" class="btn btn-sm btn-outline-secondary rounded-circle"><i class="fab fa-github"></i></a>
                            <a href="#" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fas fa-graduation-cap"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Información Detallada -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">
                    <!-- Navegación por Pestañas (Tabs) -->
                    <div class="card-header bg-transparent border-0 pt-3">
                        <ul class="nav nav-tabs card-header-tabs" id="docenteTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-semibold" id="perfil-tab" data-bs-toggle="tab" data-bs-target="#perfil-pane" type="button" role="tab">Datos Personales</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-semibold" id="docencia-tab" data-bs-toggle="tab" data-bs-target="#docencia-pane" type="button" role="tab">Datos Laborales</button>
                            </li>
                        </ul>
                    </div>

                    <!-- Contenido de las Pestañas -->
                    <div class="card-body p-4">
                        <!-- 1. EL FORMULARIO ENVUELVE TODO EL CONTENIDO DE LAS PESTAÑAS -->
                        <form action="{{url_for('docentes.updateDocente', id=docente.id)}}" method="POST">
                            
                            <div class="tab-content" id="myTabContent">  
                                <!-- PESTAÑA 1: DATOS PERSONALES -->
                                <div class="tab-pane fade show active" id="perfil-pane" role="tabpanel" tabindex="0">
                                    <!-- 2. TRASLADAMOS LAS CLASES ROW AL DIV INTERNO -->
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="nombre" class="form-label">Nombre</label>
                                            <input type="text" class="form-control" name="nombre" id="nombre" value="{{docente.nombre}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="apellido" class="form-label">Apellido</label>
                                            <input type="text" class="form-control" name="apellido" id="apellido" value="{{docente.apellido}}">
                                        </div>
                                        <div class="col-12">
                                            <label for="direccion" class="form-label">Direccion</label>
                                            <input type="text" class="form-control" name="direccion" id="direccion" value="{{docente.direccion}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="dni" class="form-label">DNI</label>
                                            <input type="text" class="form-control" name="dni" id="dni" value="{{docente.dni}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="cuil" class="form-label">Cuil</label>
                                            <input type="text" class="form-control" name="cuil" id="cuil" value="{{docente.cuil}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                                            <input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento" value="{{docente.fecha_nacimiento}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="genero" class="form-label">Genero</label>
                                            <input type="text" class="form-control" name="genero" id="genero" value="{{docente.genero}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="text" class="form-control" name="email" id="email" value="{{docente.email}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="telefono" class="form-label">Telefono</label>
                                            <input type="text" class="form-control" name="telefono" id="telefono" value="{{docente.telefono}}">
                                        </div>
                                    </div>
                                </div> <!-- CIERRE CORRECTO PESTAÑA 1 -->

                                <!-- PESTAÑA 2: DATOS LABORALES -->
                                <div class="tab-pane fade" id="docencia-pane" role="tabpanel" tabindex="0">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="fecha_contratacion" class="form-label">Inicio en Actividad: <span class="badge border border-primary text-primary">{{docente.fecha_contratacion}}</span></label>
                                            <input type="date" class="form-control" name="fecha_contratacion" id="fecha_contratacion" value="{{docente.fecha_contratacion}}">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="cargo" class="form-label">Cargo Actual: <span class="badge border border-primary text-primary">{{docente.cargo}}</span></label>
                                            <select name="cargo" class="form-select form-select-sm">
                                                <option selected>{{docente.cargo}}</option>
                                                <option value="Titular">Titular</option>
                                                <option value="Suplente">Suplente</option>
                                                <option value="Interino">Interino</option>
                                            </select>
                                        </div> 
                                        
                                        <div class="col-md-6">
                                            <label for="estado_contractual" class="form-label">Estado Contractual: <span class="badge border border-primary text-primary">{{docente.estado_contractual}}</span></label>
                                            <select name="estado_contractual" class="form-select form-select-sm">
                                                <option selected>{{docente.estado_contractual}}</option>
                                                <option value="Activo">Activo</option>
                                                <option value="Baja">Baja</option>
                                                <option value="Jubilado">Jubilado/a</option>
                                            </select>
                                        </div>
                                    </div>
                                </div> <!-- CIERRE CORRECTO PESTAÑA 2 -->
                            </div> <!-- CIERRE DEL TAB-CONTENT -->

                            <!-- BOTONES DEL FORMULARIO -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-outline-success"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-save2" viewBox="0 0 16 16">
                                <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v4.5h2a.5.5 0 0 1 .354.854l-2.5 2.5a.5.5 0 0 1-.708 0l-2.5-2.5A.5.5 0 0 1 5.5 6.5h2V2a2 2 0 0 1 2-2H14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h2.5a.5.5 0 0 1 0 1z"/>
                                </svg> Guardar</button>
                                <a href="{{ url_for('docentes.view', id=docente.id) }}" class="btn btn-outline-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
                                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                                    </svg> Cancelar</a>
                            </div>

                        </form> <!-- CIERRE DEL FORMULARIO AQUÍ (Correctamente encapsulado) -->
                        
                    </div> <!-- Cierre de card-body -->
                </div> <!-- Cierre de card -->
            </div> <!-- Cierre de col-lg-8 -->
        </div> <!-- Cierre de row -->
    </div> <!-- Cierre de container -->
  </div>

{% endblock %}
