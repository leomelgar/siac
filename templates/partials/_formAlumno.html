<form action="/newAlumno" method="POST" class="card bg-black text-light">
    <div class="card-body p-4">
      {% if tutor %}
      <div class="mb-3">
        <label for="tutor">Tutor:</label><h3>{{tutor.apellido}}, {{tutor.nombre}}</h3>
        <!-- <label for="tutor_id" name="tutor_id" value="{{tutor.idTutor}}"></label> -->
        <input type="text"
          name="tutor_id"
          class="form-control-plaintext invisible"
          value="{{tutor.idTutor}}"
          autofocus
          readonly
          required
        />
        {% endif %}
      </div>
      
      <div class="mb-3">
        <label for="nombre">Nombre:</label>
        <input
          type="text"
          name="nombre"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="escriba el nombre"
          autofocus
          required
        />
      </div>
      <div class="mb-3">
        <label for="apellido">Apellido:</label>
        <input
          type="text"
          name="apellido"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="escriba el apellido"
          autofocus
          required
        />
      </div>
      <div class="mb-3">
        <label for="cuil">Cuil:</label>
        <input
          type="text"
          name="cuil"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="cuil sin guiones"
          required
        />
      </div>
      <div class="mb-3">
        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input
          type="date"
          name="fecha_nacimiento"
          class="form-control rounded-0 bg-dark border-0 text-white"
          required
        />
      </div>
      <div class="mb-3">
        <label for="genero">Género:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="genero" value="masculino">
          <label class="form-check-label" for="genero">Masculino</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="genero" value="femenino">
          <label class="form-check-label" for="genero">Femenino</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="genero" id="inlineRadio3" value="no binario">
          <label class="form-check-label" for="genero">No Binario</label>
        </div>
      </div>
      <div class="mb-3">
        <label for="direccion">Direccion:</label>
        <input
          type="text"
          name="direccion"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="calle n° - Ciudad"
          required
        />
      </div>
      <div class="mb-3">
        <label for="telefono">telefono:</label>
        <input
          type="text"
          name="telefono"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="+54 codigo area + numero"
        />
      </div>
      <div class="mb-3">
        <label for="email">Email:</label>
        <input
          type="text"
          name="email"
          class="form-control rounded-0 bg-dark border-0 text-white"
          placeholder="ej: colegio@dominio.com.ar"
        />
      </div>  
      <button class="btn btn-primary">Guardar</button>
    </div>
  </form>
