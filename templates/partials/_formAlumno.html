<div class="container py-5">
        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta Principal de Perfil -->
            <div class="col-lg-4">
                <div class="card border-2 shadow p-3 mb-5 bg-body rounded">
                    <div class="card-body pt-5">
                        <!-- Foto de Perfil -->
                        <img src="https://github.com/mdo.png"
                             alt="Foto del Alumno" 
                             class="rounded-circle img-thumbnail mb-3" 
                             style="width: 150px; height: 150px; object-fit: cover;">                        
                    </div>
                    <div class="col-12 p-4">
                      <a href="#" class="btn btn-outline-success">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                        <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
                      </svg> Cargar Archivos</a>                        
                    </div>
                </div>
            </div>
            <!-- Columna Derecha: Información Detallada -->
            <div class="col-lg-8">
                <div class="card shadow p-3 mb-5 bg-body rounded border-2 h-100">
                    <!-- Navegación por Pestañas (Tabs) -->
                    <div class="card-header bg-transparent border-0 pt-3">
                        <ul class="nav nav-tabs card-header-tabs" id="alumnoTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-semibold" id="perfil-tab" data-bs-toggle="tab" data-bs-target="#perfil-pane" type="button" role="tab">Datos del Tutor</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-semibold" id="docencia-tab" data-bs-toggle="tab" data-bs-target="#docencia-pane" type="button" role="tab">Datos del Alumno</button>
                            </li>
                        </ul>
                    </div>

                    <!-- Contenido de las Pestañas -->
                    <div class="card-body p-4">
                        <div class="tab-content" id="myTabContent">  
                            <!-- PESTAÑA 1: DATOS PERSONALES DEL TUTOR-->
                            <div class="tab-pane fade show active" id="perfil-pane" role="tabpanel" tabindex="0">
                              <form class="row g-3" action="{{url_for('alumnos.new_alumno')}}" method="POST">
                                <div class="col-md-6">
                                  <label for="nombre_t" class="form-label">Nombre</label>
                                  <input type="text" class="form-control" name="nombre_t" id="nombre_t">
                                </div>
                                <div class="col-md-6">
                                  <label for="apellido_t" class="form-label">Apellido</label>
                                  <input type="text" class="form-control" name="apellido_t" id="apellido_t">
                                </div>
                                <div class="col-12">
                                  <label for="direccion_t" class="form-label">Direccion</label>
                                  <input type="text" class="form-control" name="direccion_t" id="direccion_t">
                                </div>
                                <div class="col-6">
                                  <label for="dni_t" class="form-label">DNI</label>
                                  <input type="text" class="form-control" name="dni_t" id="dni_t">
                                </div>
                                <div class="col-6">
                                  <label for="ocupacion" class="form-label">Ocupacion</label>
                                  <input type="text" class="form-control" name="ocupacion" id="ocupacion">
                                </div>
                                <div class="col-md-4">
                                  <label for="parentesco" class="form-label">Parentesco</label>
                                  <select name="parentesco" class="form-select">
                                    <!-- CORRECCIÓN: Agregamos value="" y disabled -->
                                    <option value="" selected disabled>elegir...</option>
                                    <option value="Padre">Padre</option>
                                    <option value="Madre">Madre</option>
                                    <option value="Hermano-a">Hermano-a</option>
                                    <option value="Abuelo-a">Abuelo-a</option>
                                    <option value="Otro">Otro</option>
                                  </select>
                                </div>
                                <div class="col-md-6">
                                  <div class="form-check form-check-inline">
                                    <label class="form-check-label" for="legal">Legal</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="legal" id="legal" value='True'>
                                    <label class="form-check-label" for="legal">Si</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="legal" id="legal" value='False'>
                                    <label class="form-check-label" for="legal">No</label>
                                  </div>
                                </div>
                                <div class="mb-3">
                                  <label for="genero_t">Genero:</label>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero_t" value="masculino">
                                    <label class="form-check-label" for="genero_t">Masculino</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero_t" value="femenino">
                                    <label class="form-check-label" for="genero_t">Femenino</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero_t" id="inlineRadio3" value="no binario">
                                    <label class="form-check-label" for="genero_t">No Binario</label>
                                  </div>
                                </div>
                                <div class="col-6">
                                  <label for="fecha_nacimiento_t" class="form-label">Fecha de Nacimiento</label>
                                  <input type="date" class="form-control" name="fecha_nacimiento_t" id="fecha_nacimiento_t">
                                </div>
                                <div class="col-6">
                                  <label for="email_t" class="form-label">Email</label>
                                  <input type="text" class="form-control" name="email_t" id="email_t">
                                </div>
                                <div class="col-md-6">
                                  <label for="telefono_t" class="form-label">Telefono</label>
                                  <input type="text" class="form-control" name="telefono_t" id="telefono_t">
                                </div>
                            </div>

                            <!-- PESTAÑA 2: AGREGAR DATOS DEL ALUMNO -->
                            <div class="tab-pane fade" id="docencia-pane" role="tabpanel" tabindex="0">
                              <div class="form-row row g-3">
                                  <div class="col-md-6">
                                  <label for="nombre" class="form-label">Nombre</label>
                                  <input type="text" class="form-control" name="nombre" id="nombre">
                                </div>
                                <div class="col-md-6">
                                  <label for="apellido" class="form-label">Apellido</label>
                                  <input type="text" class="form-control" name="apellido" id="apellido">
                                </div>
                                <div class="col-12">
                                  <label for="direccion" class="form-label">Direccion</label>
                                  <input type="text" class="form-control" name="direccion" id="direccion">
                                </div>
                                <div class="col-6">
                                  <label for="dni" class="form-label">DNI</label>
                                  <input type="text" class="form-control" name="dni" id="dni">
                                </div>
                                <div class="col-md-6">
                                  <label for="cuil" class="form-label">Cuil</label>
                                  <input type="text" class="form-control" name="cuil" id="cuil">
                                </div>
                                <div class="col-6">
                                  <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                                  <input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento">
                                </div>
                                <div class="mb-3">
                                  <label for="generoo">Genero:</label>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" value="masculino">
                                    <label class="form-check-label" for="genero">Masculino</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" value="femenino">
                                    <label class="form-check-label" for="genero">Femenino</label>
                                  </div>
                                  <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" value="no binario">
                                    <label class="form-check-label" for="genero">No Binario</label>
                                  </div>
                                </div>
                                <div class="col-6">
                                  <label for="email" class="form-label">Email</label>
                                  <input type="text" class="form-control" name="email" id="email">
                                </div>
                                <div class="col-md-6">
                                  <label for="telefono" class="form-label">Telefono</label>
                                  <input type="text" class="form-control" name="telefono" id="telefono">
                                </div>
                              </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-outline-success"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-save2" viewBox="0 0 16 16">
                                <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v4.5h2a.5.5 0 0 1 .354.854l-2.5 2.5a.5.5 0 0 1-.708 0l-2.5-2.5A.5.5 0 0 1 5.5 6.5h2V2a2 2 0 0 1 2-2H14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h2.5a.5.5 0 0 1 0 1H2z"/>
                                </svg> Guardar</button>
                                <a href="{{ url_for('alumnos.home') }}" class="btn btn-outline-danger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                </svg> Cancelar</a>
                            </div>
                            </form>
                          </div>
                          </div>
                        </div>
                      </div> 
                    </div>
                  </div>
  </div>
