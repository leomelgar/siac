{% extends "layout.html" %}
{% block title %}{{ 'Editar curso' if curso else 'Nuevo curso' }}{% endblock %}

{% block body %}
<div class="row">
  <div class="col-md-2">
   <!-- menu lateral -->
    {% include 'partials/_sidebar.html' %}
  </div>
  <div class="col-md-10">
<div class="container mt-4 bg-light p-2 rounded-3">
    <div class="card shadow p-3 mb-5 bg-body rounded border-2 h-100">
    <h2 class="text-center">{{ 'Editar curso' if curso else 'Nuevo curso' }}</h2>
<hr class="my-3 text-secondary">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Colegio</label>
            <select name="id_colegio" class="form-select" required>
                <option value="">Seleccionar...</option>
                {% for c in colegios %}
                <option value="{{ c.id_colegio }}"
                    {% if (curso and curso.id_colegio == c.id_colegio) or (form and form.get('id_colegio')|int == c.id_colegio) %}
                        selected
                    {% endif %}>
                    {{ c.nombre_colegio }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Año</label>
                <input type="text" name="anio" class="form-control" placeholder='Ej: 5to'
                       value="{{ (curso.anio if curso else (form.get('anio') if form else '')) }}" required>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">División</label>
                <input type="text" name="division" class="form-control" placeholder='Ej: A'
                       value="{{ (curso.division if curso else (form.get('division') if form else '')) }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Período lectivo</label>
            <input type="number" name="periodo_lectivo" class="form-control"
                   value="{{ (curso.periodo_lectivo if curso else (form.get('periodo_lectivo') if form else '')) }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Turno preferente (opcional)</label>
            <input type="text" name="turno_preferente" class="form-control" placeholder="Ej: Mañana"
                   value="{{ (curso.turno_preferente if curso else (form.get('turno_preferente') if form else '')) or '' }}">
        </div>

        <button type="submit" class="btn btn-outline-success"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-save" viewBox="0 0 16 16">
              <path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v7.293l2.646-2.647a.5.5 0 0 1 .708.708l-3.5 3.5a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L7.5 9.293V2a2 2 0 0 1 2-2H14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h2.5a.5.5 0 0 1 0 1z"/>
            </svg> Guardar</button>
        <a href="{{ url_for('curso.listar') }}" class="btn btn-outline-danger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
            </svg> Cancelar</a>
    </form>
    </div>
</div>
</div>
</div>
{% endblock %}
