{% extends "layout.html" %} 
{% block body %}
  {% block title %}
    Actualizar Informacion
  {% endblock %}
<div class="container">
  <h2 class="text-secondary">Alumno Legajo n° <span class="badge border border-secondary text-primary">{{alumno.legajo}}</span></h2>
     <!-- Botón Volver -->
        <div class="mb-4">
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('alumnos.view', id=alumno.id) }}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left-circle" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5z"/>
          </svg> Volver</a>
        </div>
     <div class="container py-3">
        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta Principal de Perfil -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 text-center h-100">
                    <div class="card-body pt-5">
                        <!-- Foto de Perfil -->
                        <img src="https://github.com/mdo.png"
                             alt="Foto del Docente" 
                             class="rounded-circle img-thumbnail mb-3" 
                             style="width: 150px; height: 150px; object-fit: cover;">                        
                        <!-- Nombre y Cargo -->
                        <h4 class="card-title mb-1">{{alumno.apellido}}, {{alumno.nombre}}</h4>
                        <hr>
                        <!-- Datos Legales -->
                        <div class="text-start px-3">
                          
                        </div>
                        <!-- Datos Rápidos de Contacto -->
                        <div class="text-start px-3">
                            
                        </div>
                    </div>
                    <!-- Opciones para gestionar alumno -->
                    <div class="card-footer bg-transparent border-0 pb-4">
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{{ url_for('alumnos.update_alumno', alumno=alumno.id) }}" class="btn btn-sm btn-outline-primary rounded-circle"><i class="fab fa-linkedin-in"></i>Editar</a>
                            <a href="#" class="btn btn-sm btn-outline-secondary rounded-circle"><i class="fab fa-github"></i>Promover</a>
                            <form action="#" method="POST" style="display:inline;" onsubmit="return confirm('¿Estás seguro de que deseas eliminar permanentemente a este alumno?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-circle">
                                <i class="bi bi-trash"></i> Eliminar Registro</button>
                            </form>
                            <!-- <a href="#" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fas fa-graduation-cap"></i>Eliminar</a> -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Información Detallada -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <!-- Navegación por Pestañas (Tabs) -->
                    <div class="card-header bg-transparent border-0 pt-3">
                        <ul class="nav nav-tabs card-header-tabs" id="docenteTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-semibold" id="perfil-tab" data-bs-toggle="tab" data-bs-target="#perfil-pane" type="button" role="tab">Datos personales</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-semibold" id="docencia-tab" data-bs-toggle="tab" data-bs-target="#docencia-pane" type="button" role="tab">Datos de Tutor</button>
                            </li>
                        </ul>
                    </div>

                    <!-- Contenido de las Pestañas -->
                    <div class="card-body p-4">
                      <!-- 1. EL FORMULARIO ENVUELVE TODO EL CONTENIDO DE LAS PESTAÑAS -->
                        <form action="{{url_for('alumnos.update_alumno', alumno=alumno.id)}}" method="POST">
                        <div class="tab-content" id="myTabContent"> 
                            <!-- PESTAÑA 1: PERFIL ALUMNO -->
                            <div class="tab-pane fade show active" id="perfil-pane" role="tabpanel" tabindex="0">
                                <!-- Datos personales -->
                                <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="nombre" class="form-label">Nombre</label>
                                            <input type="text" class="form-control" name="nombre" id="nombre" value="{{alumno.nombre}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="apellido" class="form-label">Apellido</label>
                                            <input type="text" class="form-control" name="apellido" id="apellido" value="{{alumno.apellido}}">
                                        </div>
                                        <div class="col-12">
                                            <label for="direccion" class="form-label">Direccion</label>
                                            <input type="text" class="form-control" name="direccion" id="direccion" value="{{alumno.direccion}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="dni" class="form-label">DNI</label>
                                            <input type="text" class="form-control" name="dni" id="dni" value="{{alumno.dni}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="cuil" class="form-label">Cuil</label>
                                            <input type="text" class="form-control" name="cuil" id="cuil" value="{{alumno.cuil}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                                            <input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento" value="{{alumno.fecha_nacimiento}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="genero" class="form-label">Genero</label>
                                            <select name="genero" id="genero" class="form-control">
                                                <option value="Masculino" {% if alumno.genero == "Masculino" %}selected{% endif %}>Masculino</option>
                                                <option value="Femenino" {% if alumno.genero == "Femenino" %}selected{% endif %}>Femenino</option>
                                                <option value="No Binario" {% if alumno.genero == "No Binario" %}selected{% endif %}>No Binario</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="text" class="form-control" name="email" id="email" value="{{alumno.email}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="telefono" class="form-label">Telefono</label>
                                            <input type="text" class="form-control" name="telefono" id="telefono" value="{{alumno.telefono}}">
                                        </div>
                                  </div>
                            </div>

                            <!-- PESTAÑA 2: DATOS DEL TUTOR -->
                            <div class="tab-pane fade" id="docencia-pane" role="tabpanel" tabindex="0">
                              <div class="table-responsive mb-4">
                                  {% for tutor in alumno.tutores%}                           
                                <img src="https://github.com/mdo.png" class="rounded-circle img-thumbnail mb-3" style="width: 150px; height: 150px; object-fit: cover;" alt="...">
                                <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="nombre_t" class="form-label">Nombre</label>
                                            <input type="text" class="form-control" name="nombre_t" id="nombre_t" value="{{tutor.nombre}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="apellido_t" class="form-label">Apellido</label>
                                            <input type="text" class="form-control" name="apellido_t" id="apellido_t" value="{{tutor.apellido}}">
                                        </div>
                                        <div class="col-12">
                                            <label for="direccion_t" class="form-label">Direccion</label>
                                            <input type="text" class="form-control" name="direccion_t" id="direccion_t" value="{{tutor.direccion}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="dni_t" class="form-label">DNI</label>
                                            <input type="text" class="form-control" name="dni_t" id="dni_t" value="{{tutor.dni}}">
                                        </div>
                                        <div class="col-6">
                                            <label for="fecha_nacimiento_t" class="form-label">Fecha de Nacimiento</label>
                                            <input type="date" class="form-control" name="fecha_nacimiento_t" id="fecha_nacimiento_t" value="{{tutor.fecha_nacimiento}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="genero_t" class="form-label">Genero</label>
                                            <select name="genero_t" id="genero_t" class="form-control">
                                                <option value="Masculino" {% if tutor.genero == "Masculino" %}selected{% endif %}>Masculino</option>
                                                <option value="Femenino" {% if tutor.genero == "Femenino" %}selected{% endif %}>Femenino</option>
                                                <option value="No Binario" {% if tutor.genero == "No Binario" %}selected{% endif %}>No Binario</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <label for="email_t" class="form-label">Email</label>
                                            <input type="text" class="form-control" name="email_t" id="email_t" value="{{tutor.email}}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="telefono_t" class="form-label">Telefono</label>
                                            <input type="text" class="form-control" name="telefono_t" id="telefono_t" value="{{tutor.telefono}}">
                                        </div>
                                  </div>
                              {% endfor %}
                                </div>
                            </div> <!-- Cierre de tab-pane docencia-pane -->
                          </div> <!-- Cierre de tab-content -->
                          <!-- BOTONES DEL FORMULARIO -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                                <a href="{{ url_for('alumnos.view', id=alumno.id) }}" class="btn btn-danger">Cancelar</a>
                            </div>
                        </form> <!-- CIERRE DEL FORMULARIO AQUÍ (Correctamente encapsulado) -->
                    </div> <!-- Cierre de card-body -->
              </div> <!-- Cierre de card -->
            </div> <!-- Cierre de tab-content -->
</div>
{% endblock %}
